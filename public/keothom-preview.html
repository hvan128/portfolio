:root{--ground:#FFF4EE;--text:#1C1410;--muted:#8A7268;--accent:#EE4D2D;--accent2:#FF7A5C}
*{margin:0;padding:0;box-sizing:border-box}
.stage{font-family:'Lexend',system-ui,sans-serif;min-height:100vh;width:100%;color:var(--text);
  background:var(--ground);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:30px 16px}
.bg-glow{position:absolute;top:-22%;left:50%;transform:translateX(-50%);width:140%;height:62%;z-index:0;
  background:radial-gradient(ellipse 52% 64% at 50% 28%,rgba(238,77,45,.16),transparent 70%)}
.bg-dots{position:absolute;inset:0;z-index:0;opacity:.5;
  background-image:radial-gradient(circle,#E9D4C9 1.4px,transparent 1.4px);background-size:30px 30px;background-position:15px 15px;
  -webkit-mask-image:radial-gradient(ellipse 75% 75% at 50% 42%,#000 35%,transparent 80%);mask-image:radial-gradient(ellipse 75% 75% at 50% 42%,#000 35%,transparent 80%)}
.wrap{position:relative;z-index:1;width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}

.brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.brand .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#EE4D2D,#FF7A5C);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -6px rgba(238,77,45,.5)}
.brand .word{font-weight:800;font-size:21px;letter-spacing:-.01em}
.brand .tag{font-weight:600;font-size:12.5px;color:var(--muted);margin-top:1px}

.phonewrap{position:relative;display:inline-block}
.device{width:316px;padding:8px;background:#0a0a0c;border-radius:40px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 30px 56px -18px rgba(90,30,12,.30),0 10px 22px -10px rgba(0,0,0,.26)}
.screen{position:relative;width:300px;height:651px;overflow:hidden;background:#F5F5F6;border-radius:34px}
.strip{display:flex;width:700%;height:100%;transition:transform .72s cubic-bezier(.22,1,.36,1)}
.cell{width:14.2857%;height:100%;flex:0 0 auto}
.cell img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0}

.badge{position:absolute;top:28%;z-index:3;display:flex;align-items:center;gap:9px;
  padding:10px 14px;border-radius:16px;background:#fff;
  box-shadow:0 14px 30px -8px rgba(40,20,10,.30),0 4px 10px -4px rgba(0,0,0,.16);
  opacity:0;transform:scale(.55);pointer-events:none}
.badge.right{right:-24px;transform-origin:88% 50%}
.badge.left{left:-24px;transform-origin:12% 50%}
.badge .bic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--accent)}
.badge .bic svg{width:17px;height:17px;color:#fff;display:block}
.badge .bv{font-weight:800;font-size:16px;line-height:1;color:var(--accent);white-space:nowrap}
.badge .bl{font-weight:600;font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.badge.tone-orange .bic{background:linear-gradient(135deg,#EE4D2D,#FF7A5C)} .badge.tone-orange .bv{color:#EE4D2D}
.badge.tone-green .bic{background:linear-gradient(135deg,#10B981,#34D399)} .badge.tone-green .bv{color:#059669}
.badge.tone-amber .bic{background:linear-gradient(135deg,#F59E0B,#FBBF24)} .badge.tone-amber .bv{color:#B45309}
.badge.tone-blue .bic{background:linear-gradient(135deg,#3B82F6,#60A5FA)} .badge.tone-blue .bv{color:#1D4ED8}
.badge.show{animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards,bob 2.6s ease-in-out .55s infinite}
@keyframes pop{0%{opacity:0;transform:scale(.55)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-7px}}

.cap{margin-top:26px;text-align:center;min-height:104px}
.step{font-weight:800;font-size:13px;letter-spacing:.16em;color:var(--accent)}
.step i{color:#D9B9AC;font-style:normal}
.title{font-weight:800;font-size:25px;letter-spacing:-.015em;margin-top:7px}
.desc{font-weight:600;font-size:14.5px;line-height:1.45;color:var(--muted);margin-top:8px;max-width:330px;margin-left:auto;margin-right:auto}
.cap .step,.cap .title,.cap .desc{opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.cap.show .step{opacity:1;transform:none;transition-delay:.04s}
.cap.show .title{opacity:1;transform:none;transition-delay:.10s}
.cap.show .desc{opacity:1;transform:none;transition-delay:.16s}

.prog{display:flex;gap:6px;margin-top:24px;width:min(78vw,300px)}
.prog span{flex:1;height:4px;border-radius:999px;background:rgba(238,77,45,.16);overflow:hidden;position:relative}
.prog span::after{content:"";position:absolute;inset:0;width:0;background:var(--accent);border-radius:999px}
.prog span.done::after{width:100%}
.prog span.active::after{width:100%;transition:width var(--dur) linear}

@media (prefers-reduced-motion: reduce){
  .strip{transition:none}.badge.show{animation:pop .25s ease forwards}
  .prog span.active::after{transition:none;width:100%}
  .cap .step,.cap .title,.cap .desc{transition:opacity .25s ease}
  .cap.show .step,.cap.show .title,.cap.show .desc{transform:none}
}
</style>
